name: Bug Report
description: Create a report to help us improve the Cloudflare Advanced integration
title: '[Bug]: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to fill out this bug report!
- type: input
  id: version
  attributes:
    label: Integration Version
    description: Which version of this integration are you using?
    placeholder: v1.0.0
  validations:
    required: true
- type: input
  id: ha_version
  attributes:
    label: Home Assistant Version
    description: Which version of Home Assistant Core has the issue?
    placeholder: 2026.6.X
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Describe the bug
    description: A clear and concise description of what the bug is.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Relevant log output
    description: Please copy and paste any relevant log output. Use the integration's debug logging if possible.
    render: shell
assignees:
- FaserF
