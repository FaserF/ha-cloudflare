name: Feature Request
description: Suggest an idea for the Cloudflare Advanced integration
title: '[Feature]: '
labels: ['enhancement', 'triage']
assignees:
  - FaserF
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

        Before submitting, please check:
        - 📋 [Existing feature requests](https://github.com/FaserF/ha-cloudflare/issues?q=is%3Aissue+label%3Aenhancement)
        - 📖 [Documentation](https://github.com/FaserF/ha-cloudflare/blob/master/README.md)

  - type: textarea
    id: description
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which area of the integration does this feature relate to?
      options:
        - DNS record management
        - Cloudflare Tunnel support
        - IP address updates (DDNS)
        - Zone / domain configuration
        - Authentication / API key handling
        - Sensor / entity improvements
        - Configuration / options
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
